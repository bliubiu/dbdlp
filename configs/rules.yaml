# dbdlp 自定义敏感识别规则（docs/02 §6.3）
#
# 说明：
#   - 本文件是「规则数据」，不是运行参数；路径由 dbdlp.toml 的 [engine].rules_file 指定。
#   - 与内置规则同构合并：rule_id 与内置重名时视为「覆盖内置定义」；本文件内 rule_id 重复则拒绝启动。
#   - 禁用不等于删除：enabled: false 或列入 globals.disabled_rules 的规则仍保留在规则快照中。
#   - verifier 必须是已注册校验器（id_card_checksum / luhn / mobile_segment / email_format /
#     social_credit_code / passport / plate / postcode / ipv4），留空表示不做业务校验。
version: "1.0.0"

globals:
  default_threshold: 0.5
  disabled_rules: []

rules:
  # ── 覆盖内置定义示例：提高手机号阈值并补充号段前缀特征 ──
  - rule_id: "MOBILE_PHONE"
    sensitive_type: "MOBILE_PHONE"
    enabled: true
    custom: false
    regex: "^1[3-9][0-9]{9}$"
    verifier: "mobile_segment"
    threshold: 0.8
    bytescan:
      min_len: 11
      max_len: 11
      digits_only: true
      prefix_bytes: ["13", "14", "15", "16", "17", "18", "19"]

  # ── 自定义类型示例：内部工号 ──
  - rule_id: "EMPLOYEE_NO"
    sensitive_type: "EMPLOYEE_NO"
    enabled: true
    custom: true
    regex: "^EMP[0-9]{6}$"
    verifier: ""
    threshold: 0.6
    bytescan:
      min_len: 9
      max_len: 9
      digits_only: false
      prefix_bytes: ["EMP"]

  # ── 自定义类型示例：合同编号（字母前缀 + 10 位数字 + 年份）──
  - rule_id: "CONTRACT_NO"
    sensitive_type: "CONTRACT_NO"
    enabled: true
    custom: true
    regex: "^HT-(20[0-9]{2})-[0-9]{10}$"
    verifier: ""
    threshold: 0.7
    bytescan:
      min_len: 18
      max_len: 18
      digits_only: false
      prefix_bytes: ["HT-"]

  # ── 自定义类型示例：客户统一编号 ──
  - rule_id: "CUSTOMER_NO"
    sensitive_type: "CUSTOMER_NO"
    enabled: false
    custom: true
    regex: "^CUS[0-9]{10}$"
    verifier: ""
    threshold: 0.5
    bytescan:
      min_len: 13
      max_len: 13
      digits_only: false
      prefix_bytes: ["CUS"]
